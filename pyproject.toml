[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-hospital"
version = "0.1.0"
description = "Code Hospital — an orchestrating MCP that diagnoses and repairs code: register, scan, diagnose, prescribe, dispense (with nursing checks), recheck, discharge."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "aiosqlite>=0.19",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
hosp = "code_hospital.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/code_hospital"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
