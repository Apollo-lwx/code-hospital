# 处方药名册。药柜归属只写在 specialties.yaml。phase 大于当前阶段的不参与匹配。
- id: debride
  name: 清创
  method: autofix
  risk: low
  phase: 1
  hold: false
  scope: line_range
  acceptance_alias: lint
  indications:
    - kind: rule
      rule_ids: [F401, F541, F841, E501, I001, java.line-length, ts.line-length]
      prefixes: [I, UP, W, C4, RET, SIM, PIE, RUF]
- id: split
  name: 拆分
  method: llm_patch
  risk: medium
  phase: 1
  hold: false
  scope: symbol
  acceptance_alias: test
  indications:
    - kind: rule
      rule_ids: [structure.function_lines, structure.file_lines, structure.cyclomatic, ts.function-lines, python.branch-count, python.too-many-params]
- id: rename
  name: 正骨
  method: llm_patch
  risk: medium
  phase: 1
  hold: false
  scope: reference_closure
  acceptance_alias: test
  risk_overrides:
    - when: touches_public_api
      risk: high
  indications:
    - kind: rule
      # 按改名动作分组的显式枚举，不用前缀（同前缀规则风险不同构，N999 是文件移动）。
      # 前提：仓库在 code-hospital.yaml catalog.rules.ruff_select 显式启用 N 前缀后才会有发现。
      rule_ids:
        - N803   # G1 局部名字：参数名
        - N806   # G1 局部名字：函数内变量
        - N802   # G2 函数/方法名 snake_case
        - N804   # G2 classmethod 首参
        - N805   # G2 方法首参
        - N807   # G2 伪 dunder
        - N801   # G3 类名 CapWords
        - N818   # G3 异常类名 error 后缀
        - N815   # G4 类作用域变量
        - N816   # G4 全局变量
        - N811   # G5 import 别名：常量名按非常量导入
        - N812   # G5 import 别名：小写名按非小写导入
        - N813   # G5 import 别名：驼峰名按小写导入
        - N814   # G5 import 别名：驼峰名按常量导入
        - N817   # G5 import 别名：驼峰名按首字母缩写导入
      # G5 别名是本文件局部绑定，天然单文件闭包（__init__.py 重导出除外，入待复核）。
      # 不接：G6 模块文件名 N999（等 LSP001）。
- id: dedupe
  name: 去重
  method: llm_patch
  risk: medium
  phase: 1
  hold: false
  scope: file
  acceptance_alias: test
  indications:
    - kind: rule
      tools: [jscpd]
      rule_ids: [clone.duplicate]
- id: guard
  name: 补罩
  method: llm_patch
  risk: medium
  phase: 1
  hold: false
  scope: symbol
  acceptance_alias: test
  indications:
    - kind: rule
      rule_ids: [BLE001, java.null-deref, java.resource-leak, java.empty-catch, python.bare-except, python.mutable-default, ts.dom-write]
      prefixes: [security., defect.]
- id: seal
  name: 封存
  method: manual
  risk: high
  phase: 1
  hold: true
  scope: line_range
  acceptance_alias: ""
  indications:
    - kind: severity
      value: critical
    - kind: tool
      tool: gitleaks
- id: supply
  name: 进货
  method: manual
  risk: high
  phase: 1
  hold: false
  scope: file
  acceptance_alias: ""
  indications:
    - kind: rule
      prefixes: [supply.]
- id: contrast
  name: 对照
  method: llm_patch
  risk: low
  phase: 1
  hold: false
  scope: test_files
  acceptance_alias: test
  indications:
    - kind: companion
      parents: [split, rename, guard, throttle]
    - kind: rule
      rule_ids: [test.uncovered-file]
- id: relocate
  name: 归位
  method: manual
  risk: high
  phase: 1
  hold: true
  scope: contract_rule
  acceptance_alias: ""
  indications:
    - kind: rule
      tools: [layer-ruler]
- id: throttle
  name: 削峰
  method: llm_patch
  risk: medium
  phase: 1
  hold: false
  scope: line_range
  acceptance_alias: test
  indications:
    - kind: rule
      rule_ids: [hotspot.loop-io, hotspot.unbounded-query]
      prefixes: [algo., perf.]
- id: repair
  name: 续治
  method: llm_patch
  risk: medium
  phase: 1
  hold: false
  scope: line_range
  acceptance_alias: test
  indications:
    - kind: rule
      rule_ids: [business.illegal-transition, business.money-float, business.missing-auth, severe.taint-sql, severe.taint-command, severe.taint-path, severe.taint-request]
    - kind: fallback
      tools: [ruff, semgrep, java-pack, eslint, type-ruler, security-ruler, defect-ruler, perf-ruler, algo-ruler, supply-ruler, test-gap, spotbugs]
