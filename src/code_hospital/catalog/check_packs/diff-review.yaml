# 合入门诊：宿主通读本次 diff。仪器命中是证据，不是全部审查。
- id: diff.map
  question: 这次改动各自在做什么
  needs: []
  executors: [code, llm]
  code: diff_map
  artifact: "每个改动文件改变了哪一段行为。要打开文件本身，不要只复述仪器规则。"
- id: diff.issues
  question: 这次改动里，哪一段新行为是错的、把失败当成成功，或把未校验的输入送了进去
  needs: [diff.map]
  executors: [llm]
  artifact: "交卷给 hosp_diagnose 的 check_answers.diff.issues。按文件分开读，一次只打开一个文件。按每个改动块看完再写：新行为错在哪里、失败被当成成功，或未校验的输入进了越权、注入、路径。看完各块之后再对一次：测试有没有把这套错行为写成断言；两块合在一起会不会拿旧状态当新状态。每一处单独一行「文件:行: 说明」，说明写错的行为。同一文件有多处就多写几行，不要停在第一处。不写风格、命名、注释、文档、可访问性、可维护性和性能。写了问题的文件算看过。范围内没出现在问题行里的文件，仍要写进「已读：」，没列全不能诊断。没有这类问题就写一行「没有」，再写一行「已读：」并列出本次范围内每个文件。没列全不能写成没有。"
- id: diff.surface
  question: 这次改动里，可访问性、可维护性或性能哪里会让人读不到、改起来容易坏，或明显变慢
  needs: [diff.map]
  executors: [llm]
  group: checklist
  artifact: "交卷给 hosp_diagnose 的 check_answers.diff.surface。按文件分开读，一次只打开一个文件。只写对比度、字形、可维护性和明显变慢。不写行为对错、失败被当成成功、未校验输入。每一处单独一行「文件:行: 说明」。同一文件有多处就多写几行，不要停在第一处。写了问题的文件算看过。范围内没出现在问题行里的文件，仍要写进「已读：」，没列全不能诊断。没有这类问题就写一行「没有」，再写一行「已读：」并列出本次范围内每个文件。没列全不能写成没有。"
