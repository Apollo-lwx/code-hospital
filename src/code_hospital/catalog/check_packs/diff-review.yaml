# 合入门诊：宿主通读本次 diff。仪器命中是证据，不是全部审查。
- id: diff.map
  question: 这次改动各自在做什么
  needs: []
  executors: [code, llm]
  code: diff_map
  artifact: "每个改动文件改变了哪一段行为。要打开文件本身，不要只复述仪器规则。"
- id: diff.issues
  question: 这次改动里，哪一段新行为是错的、把失败当成成功，或把未校验的输入送了进去
  needs: [diff.map]
  executors: [llm]
  artifact: "交卷给 hosp_diagnose 的 check_answers.diff.issues。按每个改动块看完再写：新行为错在哪里、失败被当成成功，或未校验的输入进了越权、注入、路径。看完各块之后再对一次：测试有没有把这套错行为写成断言；两块合在一起会不会拿旧状态当新状态。每一处单独一行「文件:行: 说明」，说明写错的行为。同一文件有多处就多写几行，不要停在第一处。不写风格、命名、注释、文档和「可以更好」。没有这类问题就写一行「没有」，再写一行「已读：」并列出本次范围内每个文件。没列全不能写成没有。"
